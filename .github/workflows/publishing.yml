name: Publish to PyPI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - master
    paths:
      - pyproject.toml
  workflow_dispatch:

jobs:
  test-pypi-connection:
    name: Test PyPI Connection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test PyPI Connection
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://pypi.org/)
          if [ "$STATUS" != "200" ]; then
            echo "PyPI connection failed with status $STATUS"
            exit 1
          fi

  check-version:
    name: Check Version Change
    needs: test-pypi-connection
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      version: ${{ steps.check.outputs.version }}
      package: ${{ steps.check.outputs.package }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Version Change
        id: check
        env:
          BASE_SHA: ${{ github.event.before }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python3 -c '
          import os, re, subprocess, sys

          base_sha = os.environ.get("BASE_SHA", "")
          base_text = ""
          if base_sha and not base_sha.startswith("0000000"):
              try:
                  base_text = subprocess.check_output(["git", "show", f"{base_sha}:pyproject.toml"], text=True)
              except Exception:
                  pass

          if not base_text:
              try:
                  base_text = subprocess.check_output(["git", "show", "HEAD~1:pyproject.toml"], text=True)
              except Exception:
                  base_text = ""

          with open("pyproject.toml", "r", encoding="utf-8") as f:
              head_text = f.read()

          def parse_field(text, field):
              m = re.search(rf"^{field}\s*=\s*[\"\x27]([^\"\x27]+)[\"\x27]", text, flags=re.MULTILINE)
              return m.group(1) if m else ""

          base_version = parse_field(base_text, "version")
          head_version = parse_field(head_text, "version")
          pkg_name = parse_field(head_text, "name")

          is_manual = os.environ.get("IS_MANUAL", "false").lower() == "true"
          if is_manual:
              version_changed = "true" if head_version else "false"
          else:
              version_changed = "true" if (base_version != head_version and head_version) else "false"

          output_file = os.environ.get("GITHUB_OUTPUT")
          if output_file:
              with open(output_file, "a", encoding="utf-8") as out:
                  out.write(f"package={pkg_name}\n")
                  out.write(f"version={head_version}\n")
                  out.write(f"version_changed={version_changed}\n")
          print(f"Package: {pkg_name}, Old Version: {base_version}, New Version: {head_version}, Changed: {version_changed}")
          '

  publish-pypi:
    name: Publish to PyPI
    needs: [test-pypi-connection, check-version]
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Version on PyPI
        id: check-pypi
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          PKG: ${{ needs.check-version.outputs.package }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/${PKG}/${VERSION}/json")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack - Version Already Exists
        if: steps.check-pypi.outputs.exists == 'true' && env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        uses: slackapi/slack-github-action@v2
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ *${{ needs.check-version.outputs.package }} ${{ needs.check-version.outputs.version }}* already exists on PyPI. Publication aborted."
            }

      - name: Fail - Version Already Exists
        if: steps.check-pypi.outputs.exists == 'true'
        run: |
          echo "::error::Version ${{ needs.check-version.outputs.version }} already exists on PyPI."
          exit 1

      - name: Setup uv
        if: steps.check-pypi.outputs.exists == 'false'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build Distribution
        if: steps.check-pypi.outputs.exists == 'false'
        run: uv build

      - name: Publish to PyPI
        if: steps.check-pypi.outputs.exists == 'false'
        run: uv publish --trusted-publishing always

      - name: Notify Slack - Published to PyPI
        if: steps.check-pypi.outputs.exists == 'false' && env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        uses: slackapi/slack-github-action@v2
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ *${{ needs.check-version.outputs.package }} ${{ needs.check-version.outputs.version }}* successfully published to PyPI."
            }

name: Publish to PyPI

permissions:
  contents: read

on:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - pyproject.toml

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      version: ${{ steps.check.outputs.version }}
      package: ${{ steps.check.outputs.package }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Version Change
        id: check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          BASE_VERSION=$(git show "origin/${BASE_REF}:pyproject.toml" | grep -m 1 '^version = ' | cut -d'"' -f2)
          HEAD_VERSION=$(grep -m 1 '^version = ' pyproject.toml | cut -d'"' -f2)
          PKG=$(grep -m 1 '^name = ' pyproject.toml | cut -d'"' -f2)
          echo "package=${PKG}" >> "$GITHUB_OUTPUT"
          if [ "$BASE_VERSION" != "$HEAD_VERSION" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "version=${HEAD_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish-pypi:
    needs: detect-version
    if: github.event.pull_request.merged == true && needs.detect-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Version on PyPI
        id: check-pypi
        env:
          VERSION: ${{ needs.detect-version.outputs.version }}
          PKG: ${{ needs.detect-version.outputs.package }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/${PKG}/${VERSION}/json")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack - Version Already Exists
        if: steps.check-pypi.outputs.exists == 'true'
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ *${{ needs.detect-version.outputs.package }} ${{ needs.detect-version.outputs.version }}* already exists on PyPI. Publication aborted."
            }

      - name: Fail - Version Already Exists
        if: steps.check-pypi.outputs.exists == 'true'
        run: |
          echo "::error::Version ${{ needs.detect-version.outputs.version }} already exists on PyPI."
          exit 1

      - name: Setup uv
        if: steps.check-pypi.outputs.exists == 'false'
        uses: astral-sh/setup-uv@v5

      - name: Build
        if: steps.check-pypi.outputs.exists == 'false'
        run: uv build

      - name: Publish to PyPI
        if: steps.check-pypi.outputs.exists == 'false'
        run: uv publish --trusted-publishing always

      - name: Notify Slack - Published to PyPI
        if: steps.check-pypi.outputs.exists == 'false'
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ *${{ needs.detect-version.outputs.package }} ${{ needs.detect-version.outputs.version }}* successfully published to PyPI."
            }

[project]
name = "projtree"
version = "1.1.1"
description = "Generate a deterministic Markdown representation of a project directory tree"
requires-python = ">=3.10"
dependencies = ["watchdog>=5.0.0"]

[project.scripts]
projtree = "projtree.cli:main"

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"

[project.optional-dependencies]
dev = ["pytest"]

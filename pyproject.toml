[project]
name = "projtree"
version = "1.2"
readme = "README.md"
description = "Generate a deterministic Markdown representation of a project directory tree"
license = {file = "LICENSE"}
authors = [{name = "Nuxview"}]
requires-python = ">=3.10"
dependencies = ["watchdog>=5.0.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
projtree = "projtree.cli:main"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"

[tool.setuptools.packages.find]
include = ["projtree*"]
